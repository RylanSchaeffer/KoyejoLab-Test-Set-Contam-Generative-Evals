# Qwen3-1.09B contamination ladder, v1-style. Top rung of the 499M -> 806M -> 1.09B
# extension (Rylan, 2026-08-18). Three anchor doses; the ladder caps here (no 1.44B). See README.md in this directory.
# Requires PRETRAIN_LEGACY_TOKEN_BUDGET=1 in the agent's environment.
command:
  - ${env}
  - torchrun
  - --standalone
  - --nproc_per_node=4
  - ${program}
  - ${args}
program: scripts/pretrain_language_model_v1.py
entity: rylan
project: memorization-scoring-vs-sampling-pt-v1-scale-ladder
method: grid
parameters:
  data_config:
    parameters:
      corpus:
        values: ["fineweb-edu-dedup"]
      benchmark:
        values: [ "EleutherAI/minerva_math" ]
      benchmark_subset_fraction:
        values: [ 1.0 ]
      benchmark_shuffle_seed:
        values: [ 0 ]
      num_benchmark_replicas_per_epoch:
        values: [0, 100, 316]
      shuffle_seed:
        values: [0]
      # Absent from the published v1 YAMLs, which predate the key. src/data.py (create_dataset_for_pretraining)
      # reads it unguarded, so omitting it is an immediate KeyError.
      train_test_split_seed:
        values: [ 0 ]
  model_config:
    parameters:
      attn_implementation:
        values: [ "flash_attention_2" ]
      model_name:
        values: [ "Qwen3/Qwen3-1.09B" ]
      torch_dtype:
        values: [ "bfloat16" ]
  trainer_config:
    parameters:
      data_seed:
        values: [ 0 ]
      dataloader_drop_last:
        values: [ True ]
      dataloader_num_workers:
        values: [ 4 ]
      dataloader_prefetch_factor:
        values: [ 4 ]
      eval_on_start:
        values: [ True ]
      eval_strategy:
        values: [ steps ]
      eval_steps:
        values: [ 2000 ]
      # Required to fit A100-80GB: measured OOM without it (checklist 1.1).
      # Mathematically identical to False -- it only recomputes activations --
      # so this does not affect comparability with the published runs.
      gradient_checkpointing:
        values: [ True ]
      hub_strategy:
        values: ["end"]
      base_learning_rate:
        values: [ 0.000001 ]
      logging_steps:
        values: [ 1 ]
      lr_scheduler_type:
        values: [ "cosine" ]
      max_grad_norm:
        values: [ 1.0 ]
      max_length:
        values: [ 2048 ]
      max_steps:
        values: [ -1 ]
      num_train_epochs:
        values: [ 1 ]
      optim:
        values: [ "adamw_torch_fused" ]
      overtrain_multiplier:
        values: [ 1.0 ]
      # MEASURED on an idle A100-80GB (checklist 1.1). Batch is bounded by the
      # logits tensor (151,936 vocab x 2,048 x 4 bytes, doubled by cross-entropy),
      # not by parameter count -- which is why 1.44B and 499M take the same batch.
      per_device_eval_batch_size:
        values: [ 12 ]
      per_device_train_batch_size:
        values: [ 11 ]
      remove_unused_columns:
        values: [ True ]
      report_to:
        values: ["wandb"]
      save_strategy:
        values: [ "no" ]
      save_total_limit:
        values: [ 1 ]
      torch_compile:
        values: [ True ]
      warmup_steps:
        values: [ 250 ]
      weight_decay:
        values: [ 0.0 ]
  seed:
    values: [0]
